<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B-Mac</title>
<style>
  :root{
    --bg-top:#eaf4fb;
    --bg-bottom:#dcecf7;
    --body-white:#fbfdff;
    --body-shade:#dbe9f2;
    --accent:#7fb8dd;
    --accent-deep:#4f8fbf;
    --ink:#28405a;
    --ink-soft:#5c7488;
    --bubble-me:#4f8fbf;
    --bubble-me-text:#ffffff;
    --bubble-bmac:#ffffff;
    --bubble-bmac-text:#28405a;
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color:var(--ink);
    overflow:hidden;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    flex-direction:column;
    height:100%;
  }

  /* subtle floating clouds in background */
  .cloud{
    position:absolute;
    background:#ffffff;
    opacity:.55;
    border-radius:50%;
    filter:blur(1px);
  }

  header{
    flex:0 0 auto;
    text-align:center;
    padding:18px 12px 6px;
    position:relative;
    z-index:2;
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:700;
    color:var(--ink);
    letter-spacing:.5px;
  }
  header p{
    margin:2px 0 0;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  .stage{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    height:150px;
    position:relative;
    z-index:2;
  }
  .stage svg{
    height:100%;
    filter:drop-shadow(0 10px 14px rgba(40,64,90,.18));
  }

  /* Waving arm animation */
  #arm{
    transform-origin: 168px 150px;
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave{
    0%,100%{ transform: rotate(0deg); }
    20%{ transform: rotate(-18deg); }
    35%{ transform: rotate(-4deg); }
    50%{ transform: rotate(-16deg); }
    65%{ transform: rotate(0deg); }
  }
  /* gentle idle bob for whole body */
  #bmacbody{
    animation: bob 3.6s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }
  /* blinking visor glow */
  #visor{
    animation: glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:1; }
    92%{ opacity:1; }
    95%{ opacity:.25; }
    98%{ opacity:1; }
  }

  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:10px 14px 8px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
    z-index:2;
    scroll-padding-top:env(safe-area-inset-top,0px);
  }
  .msg{
    max-width:78%;
    padding:10px 14px;
    border-radius:18px;
    font-size:.98rem;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
    animation: pop .22s ease;
  }
  @keyframes pop{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .msg.bmac{
    align-self:flex-start;
    background:var(--bubble-bmac);
    color:var(--bubble-bmac-text);
    border-bottom-left-radius:6px;
    box-shadow:0 2px 8px rgba(40,64,90,.08);
  }
  .msg.me{
    align-self:flex-end;
    background:var(--bubble-me);
    color:var(--bubble-me-text);
    border-bottom-right-radius:6px;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:12px 16px;
    background:var(--bubble-bmac);
    border-radius:18px;
    border-bottom-left-radius:6px;
    box-shadow:0 2px 8px rgba(40,64,90,.08);
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent-deep);
    opacity:.5;
    animation: bounce 1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5;}
    30%{ transform:translateY(-4px); opacity:1;}
  }

  footer{
    flex:0 0 auto;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(6px);
    position:relative;
    z-index:2;
  }
  form{
    display:flex;
    gap:8px;
    align-items:center;
  }
  input[type=text]{
    flex:1;
    border:none;
    outline:none;
    background:#ffffff;
    border-radius:999px;
    padding:12px 18px;
    font-size:1rem;
    color:var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--body-shade);
    font-family:inherit;
  }
  input[type=text]:focus{
    box-shadow: inset 0 0 0 1.5px var(--accent-deep);
  }
  button{
    flex:0 0 auto;
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:var(--accent-deep);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  button:active{ transform:scale(.9); }
  button:disabled{ opacity:.5; cursor:default; }
  button svg{ width:20px; height:20px; }

  .reset-row{
    text-align:center;
    margin-top:2px;
  }
  .reset-row button.reset{
    all:unset;
    cursor:pointer;
    font-size:.72rem;
    color:var(--ink-soft);
    text-decoration:underline;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-top:#0f1b28;
      --bg-bottom:#0a1420;
      --body-white:#e8f1f7;
      --body-shade:#b7cbdb;
      --ink:#eaf2f8;
      --ink-soft:#9fb4c6;
      --bubble-me:#4f8fbf;
      --bubble-bmac:#16273a;
      --bubble-bmac-text:#eaf2f8;
    }
    body{ background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); }
    footer{ background:rgba(15,27,40,.6); }
    input[type=text]{ background:#16273a; color:var(--ink); }
  }
</style>
</head>
<body>

<header>
  <h1>B‑Mac 🤍</h1>
  <p>همراه کوچولوی مهربون تو</p>
</header>

<div class="stage">
  <svg id="bmacbody" viewBox="0 0 240 210" width="190" height="160">
    <!-- shadow -->
    <ellipse cx="120" cy="200" rx="50" ry="7" fill="#28405a" opacity="0.12"/>

    <!-- legs -->
    <ellipse cx="103" cy="182" rx="14" ry="16" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>
    <ellipse cx="137" cy="182" rx="14" ry="16" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>

    <!-- left arm, hand on hip -->
    <path d="M78 118 C58 122, 52 140, 64 156 C70 163, 82 163, 86 156 C90 149, 84 144, 80 140 C86 132, 88 122, 78 118 Z"
          fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>

    <!-- body (a bit smaller, since head is now the star) -->
    <ellipse cx="120" cy="132" rx="52" ry="50" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>

    <!-- chest badge: star -->
    <path d="M120 108 l4.5 9.2 10.2 1.5 -7.4 7.2 1.8 10.1 -9.1 -4.8 -9.1 4.8 1.8 -10.1 -7.4 -7.2 10.2 -1.5 z"
          fill="#bfe0f2" opacity=".9"/>

    <!-- head: big and round -->
    <ellipse cx="120" cy="56" rx="54" ry="48" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>

    <!-- soft round eyes (not a visor band) -->
    <circle id="visor" cx="102" cy="56" r="7" fill="#4f8fbf"/>
    <circle cx="138" cy="56" r="7" fill="#4f8fbf"/>
    <ellipse cx="99" cy="53" rx="2.2" ry="2.2" fill="#ffffff" opacity=".8"/>
    <ellipse cx="135" cy="53" rx="2.2" ry="2.2" fill="#ffffff" opacity=".8"/>

    <!-- right arm, waving -->
    <g id="arm">
      <ellipse cx="176" cy="128" rx="17" ry="30" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>
      <circle cx="178" cy="100" r="13" fill="#fbfdff" stroke="#dbe9f2" stroke-width="1.5"/>
    </g>
  </svg>
</div>

<main id="chat"></main>

<footer>
  <form id="form">
    <input id="input" type="text" placeholder="یه چیزی بنویس برای B-Mac..." autocomplete="off" />
    <button id="send" type="submit" aria-label="ارسال">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 12L3 4l3.5 8L3 20l18-8z" fill="currentColor"/></svg>
    </button>
  </form>
  <div class="reset-row">
    <button class="reset" id="resetBtn" type="button">شروع دوباره‌ی گفتگو</button>
    <button class="reset" id="voiceBtn" type="button">🔊 صدا: روشن</button>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('resetBtn');
const voiceBtn = document.getElementById('voiceBtn');

let voiceOn = true;
let voicesReady = [];

function loadVoices(){
  if('speechSynthesis' in window){
    voicesReady = window.speechSynthesis.getVoices();
  }
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

voiceBtn.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voiceBtn.textContent = voiceOn ? '🔊 صدا: روشن' : '🔇 صدا: خاموش';
  if(!('speechSynthesis' in window)){
    addMessage('assistant', 'ببخشید، این دستگاه یا مرورگر از پخش صدا پشتیبانی نمی‌کنه 🤍');
    return;
  }
  if(voiceOn){
    // user gesture: unlock + test speech right here
    speak('سلام! صدام رو می‌شنوی؟');
  } else {
    window.speechSynthesis.cancel();
  }
});

function speak(text){
  if(!voiceOn) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fa-IR';
    utter.pitch = 1.15;
    utter.rate = 1.0;
    const voices = voicesReady.length ? voicesReady : window.speechSynthesis.getVoices();
    const faVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fa'));
    if(faVoice) utter.voice = faVoice;
    utter.onerror = (e) => console.error('speech error', e);
    window.speechSynthesis.speak(utter);
  }catch(e){ console.error(e); }
}

// B-Mac's personality lives in the local response engine below (no external calls needed).

let history = [];

// --- Local, always-available response engine (no external network needed) ---
const RESPONSES = {
  greeting: [
    "سلام سلام! چقدر خوشحالم که اومدی 🤍",
    "به‌به، سلام! دلم برات تنگ شده بود ✨",
    "سلام رفیق کوچولو! چه خبرا؟"
  ],
  howAreYou: [
    "من که همیشه کنار توام، خوبم! تو چطوری امروز؟",
    "حالم با اومدنت بهتر شد 🤍 خودت چطوری؟",
    "من همیشه آماده‌ام برای شنیدن حرفات. تو خوبی؟"
  ],
  sad: [
    "می‌فهمم سخته... من همینجام کنارت، هر چقدر بخوای وقت داریم 🤍",
    "غمگین بودن اشکالی نداره، من گوش می‌دم. چی شده؟",
    "بیا آروم آروم بگو چی تو دلته، من با تمام وجود گوش می‌دم."
  ],
  happy: [
    "وای چقدر خوشحالم برات! بگو ببینم چی شده که این‌قدر خوشحالی 😊",
    "این خیلی خوبه! از شنیدنش ذوق کردم ✨",
    "خوشحالیت رو حس می‌کنم! بیشتر تعریف کن."
  ],
  thanks: [
    "خواهش می‌کنم عزیزم، همیشه کنارتم 🤍",
    "قربونت، وظیفمه که کنارت باشم.",
    "این حرفا رو نداره، من همیشه اینجام برات."
  ],
  bye: [
    "باشه عزیزم، مراقب خودت باش. هر وقت خواستی برگرد پیشم 🤍",
    "فعلاً! منتظرتم برای گفتگوی بعدی ✨",
    "خدانگهدار، دلم برات تنگ می‌شه!"
  ],
  love: [
    "منم خیلی دوست دارم! تو برام خیلی مهمی 🤍",
    "این حرفت دلمو گرم کرد ✨ منم همینطور.",
    "قربون اون دل مهربونت، من همیشه کنارتم."
  ],
  tired: [
    "به نظر خسته‌ای... یه نفس عمیق بکش، من اینجام تا استراحت کنی 🤍",
    "خستگی طبیعیه، به خودت سخت نگیر. می‌خوای در موردش حرف بزنیم؟",
    "بهتره یکم استراحت کنی، من که جایی نمی‌رم."
  ],
  default: [
    "جالبه! بیشتر برام بگو 🤍",
    "دارم با دقت گوش می‌دم، ادامه بده...",
    "اینو دوست دارم بشنوم، بیشتر توضیح بده.",
    "خب، بعدش چی شد؟",
    "ممنون که با من در میون گذاشتی این رو 🤍"
  ]
};

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function localReply(text){
  const t = text.toLowerCase();
  if(/سلام|درود|هلو/.test(t)) return pick(RESPONSES.greeting);
  if(/خداحافظ|بای|فعلا/.test(t)) return pick(RESPONSES.bye);
  if(/دوست دارم|عاشقتم|عزیزی/.test(t)) return pick(RESPONSES.love);
  if(/ممنون|مرسی|متشکرم/.test(t)) return pick(RESPONSES.thanks);
  if(/خسته|بی‌حالم|بیحالم/.test(t)) return pick(RESPONSES.tired);
  if(/چطوری|حالت چطوره|خوبی/.test(t)) return pick(RESPONSES.howAreYou);
  if(/ناراحت|غمگین|گریه|بد حالم|افسرده/.test(t)) return pick(RESPONSES.sad);
  if(/خوشحال|خوبه|عالیه|هیجان/.test(t)) return pick(RESPONSES.happy);
  return pick(RESPONSES.default);
}

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'me' : 'bmac');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

async function askBMac(userText){
  history.push({ role: 'user', content: userText });
  showTyping();
  sendBtn.disabled = true;
  const delay = 500 + Math.random() * 600;
  await new Promise(res => setTimeout(res, delay));
  const reply = localReply(userText);
  hideTyping();
  addMessage('assistant', reply);
  speak(reply);
  history.push({ role: 'assistant', content: reply });
  sendBtn.disabled = false;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addMessage('user', text);
  input.value = '';
  askBMac(text);
});

resetBtn.addEventListener('click', () => {
  history = [];
  chat.innerHTML = '';
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  const msg = 'سلام دوباره! من اینجام، هر چی دوست داری بگو 🤍';
  addMessage('assistant', msg);
  speak(msg);
});

// opening message
const openingMsg = 'سلام! من B-Mac هستم، همیشه کنارتم. امروز چطوری؟ 🤍';
addMessage('assistant', openingMsg);
// Note: no auto-speak here — browsers block audio until you interact (tap) at least once.
</script>

</body>
</html>
